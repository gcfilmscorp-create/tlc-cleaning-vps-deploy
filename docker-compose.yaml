name: tlc-cleaning

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: tlc-cleaning-site:2026-09-07-01
    container_name: tlc-cleaning-site
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1.0
    networks:
      - gcfilms_edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=gcfilms_edge
      - traefik.http.routers.tlcpreview.rule=Host(`tlc-cleaning.46.202.178.171.nip.io`)
      - traefik.http.routers.tlcpreview.entrypoints=websecure
      - traefik.http.routers.tlcpreview.tls.certresolver=letsencrypt
      - traefik.http.routers.tlcpreview.middlewares=limite-taxa-publico@file
      - traefik.http.services.tlcpreview.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  gcfilms_edge:
    external: true
